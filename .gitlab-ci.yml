stages:
  - test
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip-$CI_JOB_NAME
  paths:
    - .cache/pip

default:
  image: python:3.12
  interruptible: true
  # Jobs normally take under 5 minutes; fail a hung one before it blocks the queue.
  timeout: 20 minutes
  before_script:
    # `pip install --group` needs pip >= 25.1 (PEP 735).
    - python3 -m pip install --upgrade pip

# One job for all tests: the runners take one job at a time, so a separate
# JWST job would only add a second install.
test:
  stage: test
  script:
    - python3 -m pip install -e .[all] --group test
    - pytest -n auto --cov=jubik test/
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)$/'

demos:
  stage: test
  variables:
    # Headless matplotlib: the demos call `plt.show()`.
    MPLBACKEND: Agg
  script:
    - python3 -m pip install -e .[healpix,resolve]
    # Only the demos which are self-contained are executed here.
    - cd demos
    - for demo in grids spectral_sky_demo spectral_sky_healpix_demo point_source_sky_demo resolve_synthetic_demo; do
        echo "Running ${demo}.py";
        python3 "${demo}.py" || exit 1;
      done

# Keeps `[all]`: autodoc imports every module, including the JWST ones.
pages:
  stage: release
  interruptible: false
  script:
    - python3 -m pip install .[all] --group doc
    - sh docs/generate.sh
    - mv docs/build/ public/
  artifacts:
    paths:
    - public
  only:
  - main
