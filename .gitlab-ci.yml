
stages:
  - test
  - release

before_script:
  - python3 -m pip install -e .[resolve]
test:
  image: python:latest
  stage: test
  script:
    - pip install pytest pytest-cov
    - pip install .[healpix]
    - pytest --cov=jubik test/
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)$/'

# The JWST roundtrip and the JWST instrument tests need the heavy `jwst`
# extra, which the main test job does not install.
test-jwst:
  image: python:latest
  stage: test
  script:
    - pip install pytest
    - pip install .[jwst]
    - pytest test/conventions/test_claims_jwst.py test/instruments/jwst

demos:
  image: python:latest
  stage: test
  variables:
    # Headless matplotlib: the demos call `plt.show()`.
    MPLBACKEND: Agg
  script:
    # Only the demos which are self-contained are executed here.
    - cd demos
    - for demo in grids spectral_sky_demo spectral_sky_healpix_demo point_source_sky_demo resolve_synthetic_demo; do
        echo "Running ${demo}.py";
        python3 "${demo}.py" || exit 1;
      done

pages:
  image: python:latest
  stage: release
  script:
    - pip install .[doc]
    - sh docs/generate.sh
    - mv docs/build/ public/
  artifacts:
    paths:
    - public
  only:
  - main
