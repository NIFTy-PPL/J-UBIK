stages:
  - test
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip-$CI_JOB_NAME
  paths:
    - .cache/pip
  # Keep downloads from a job whose tests failed, for the retry.
  when: always

default:
  image: python:3.12
  interruptible: true
  before_script:
    # `pip install --group` needs pip >= 25.1 (PEP 735).
    - python3 -m pip install --upgrade pip

# Jobs normally take under 5 minutes; `timeout` is set per job because GitLab
# ignores it under `default:`. One job for all tests: jobs mostly run one after
# another on the shared runners, so a separate JWST job would only add an install.
test:
  stage: test
  timeout: 20 minutes
  script:
    - python3 -m pip install -e .[all] --group test
    # A fixed worker count: `auto` would start one JAX process per host CPU.
    - pytest -n 4 --cov=jubik test/
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)$/'

demos:
  stage: test
  timeout: 20 minutes
  variables:
    # Headless matplotlib: the demos call `plt.show()`.
    MPLBACKEND: Agg
  script:
    - python3 -m pip install -e .[healpix,resolve]
    # Only the demos which are self-contained are executed here.
    - cd demos
    - for demo in grids spectral_sky_demo spectral_sky_healpix_demo point_source_sky_demo resolve_synthetic_demo; do
        echo "Running ${demo}.py";
        python3 "${demo}.py" || exit 1;
      done

# Keeps `[all]`: autodoc imports every module, including the JWST ones.
pages:
  stage: release
  timeout: 20 minutes
  interruptible: false
  script:
    - python3 -m pip install .[all] --group doc
    - sh docs/generate.sh
    - mv docs/build/ public/
  artifacts:
    paths:
    - public
  only:
  - main
