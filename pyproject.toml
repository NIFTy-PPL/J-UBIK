[project]
name = "jubik"
description = "X-Ubik"
readme = "README.md"
authors = [
    {name = "Vincent Eberle", email = "veberle@mpa-garching.mpg.de"},
    {name = "Matteo Guardiani", email = "matteani@mpa-garching.mpg.de"},
    {name = "Margret Westerkamp", email = "margret@mpa-garching.mpg.de"},
]
version = "0.4"
requires-python = ">=3.10"
dependencies = [
    "numpy >= 1.17.0",
    "scipy >= 1.9.0",
    "nifty >= 9.0.0",
    "jax",
    "jaxlib",
    "matplotlib",
    "astropy",
    "ducc0",
    "pyyaml",
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]


# One extra per instrument backend that has pip dependencies. Chandra and
# eROSITA have none: their instrument software (CIAO and marx, eSASS) is
# conda-only or runs in a docker container, so an extra could not deliver a
# working install. See README.
[project.optional-dependencies]
jwst = [
    "gwcs>=0.24.0",
    "jwst>=1.9.1",
    "stpsf>=2.1.0",
    "jax-finufft",
]
gaia = [
    "astroquery",
]
# The HEALPix sky model calls ducc0's spherical harmonic transform through
# nifty, which imports jaxbind for it.
healpix = [
    "jaxbind",
]
resolve = [
    "jaxbind",
    "jax-finufft",
    "cufinufft>=2.3",
    "python-casacore",
    "ehtim",
]
all = ["jubik[jwst,gaia,healpix,resolve]"]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
doc = [
    "sphinx<8.2",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "myst-parser",
    "jupyter",
    "nbconvert",
    "jupytext",
]
dev = [
    {include-group = "test"},
    {include-group = "doc"},
    "ipython",
]

[tool.uv]
# `uv sync` gives the inference package alone. Opt in with `uv sync --group dev`.
default-groups = []

[build-system]
requires = ["setuptools >= 65.7.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jubik", "jubik*"]
